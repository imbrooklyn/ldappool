name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.13", "1.26.6"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go mod verify
      - run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=20 -coverprofile=coverage.out ./...
      - run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) exit 1 }'
      - if: matrix.go == '1.26.6'
        run: go test -race -count=10 ./...
      - if: matrix.go == '1.26.6'
        run: |
          go test -run='^$' -fuzz=FuzzEndpointAndServerNameNeverPanic -fuzztime=5s
          go test -run='^$' -fuzz=FuzzBackoffIsPositiveAndCapped -fuzztime=5s
          go test -run='^$' -fuzz=FuzzCredentialReasonSanitization -fuzztime=5s
          go test -run='^$' -fuzz=FuzzCredentialGuardCommandSequence -fuzztime=5s
          go test -run='^$' -fuzz=FuzzMalformedLDAPResponseNeverEscapesPanic -fuzztime=5s
      - if: matrix.go == '1.26.6'
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.6"
          go-package: ./...
          repo-checkout: false

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum
      - run: GOOS=linux GOARCH=amd64 go test -c -o /tmp/ldappool-linux-amd64.test
      - run: GOOS=linux GOARCH=arm64 go test -c -o /tmp/ldappool-linux-arm64.test
      - run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/ldappool-windows-amd64.test.exe
